# Base de donnees
# ---------------
# Par defaut : H2 sur fichier, pratique en local et pour les tests.
# En production, ces trois proprietes sont surchargees par les variables
# d'environnement SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD (Spring Boot
# les lit automatiquement). Le driver et le dialecte ne sont volontairement
# pas figes ici : ils sont deduits de l'URL, ce qui permet de pointer vers
# PostgreSQL sans toucher au code.
spring.datasource.url=jdbc:h2:file:./data/leitner-system
spring.datasource.username=sa
spring.datasource.password=sa

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

# Console H2 : desactivee par defaut. Elle donne un acces direct a la base et
# ne doit jamais etre exposee sur Internet. Pour l'utiliser en local :
# H2_CONSOLE_ENABLED=true ./mvnw spring-boot:run
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.settings.trace=false

# Serveur
# -------
# Render (comme la plupart des PaaS) impose d'ecouter le port fourni par la
# variable d'environnement PORT.
server.port=${PORT:8080}
server.host=localhost

# URL publique affichee dans Swagger ; a surcharger en production avec
# PUBLIC_URL=https://mon-service.onrender.com
server.url=${PUBLIC_URL:http://localhost:8080}
server.description=${PUBLIC_SERVER_DESCRIPTION:Local server}

server.servlet.swagger-ui.path=/swagger-ui.html
springdoc.swagger-group=leitner-system
